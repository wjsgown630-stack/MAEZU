<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>site-nav 헤더 예시</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
body { margin:0; background:#fff; }
.site-nav { background:#fdfbf7; color:#333; font-family:"Noto Sans KR",sans-serif; }
.site-nav-inner { box-sizing:border-box; width:100%; height:80px; padding:0 60px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:center; }
.site-nav-menu { display:flex; align-items:center; gap:40px; list-style:none; margin:0; padding:0; white-space:nowrap; }
.site-nav-menu a { color:inherit; text-decoration:none; font-size:14px; font-weight:500; line-height:19.6px; letter-spacing:.28px; }
.site-nav-logo { justify-self:center; display:block; padding:7.5px; line-height:0; }
.site-nav-logo img { width:23px; height:57px; }
.site-nav-actions { display:flex; justify-self:end; }
.site-nav-button { box-sizing:border-box; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:40px; height:40px; border:0; padding:0; background:transparent; color:inherit; cursor:pointer; }
.site-nav-button img { width:20px; height:20px; }
.site-nav-cart { margin-right:-12px; }
.site-nav-toggle { display:none; margin-left:-10px; }
@media(max-width:989px) {
  .site-nav-inner { height:65px; padding:0 20px; }
  .site-nav-menu { display:none; }
  .site-nav-toggle { display:flex; }
  .site-nav-logo { padding:0; }
}
</style>
</head>
<body>
<header class="site-nav">
  <div class="site-nav-inner">
    <nav aria-label="주 메뉴">
      <button class="site-nav-button site-nav-toggle" aria-label="메뉴"><img src="menu.svg" alt=""></button>
      <ul class="site-nav-menu">
        <li><a href="https://kr.bluebottlecoffee.com/collections/all">쇼핑</a></li>
        <li><a href="https://kr.bluebottlecoffee.com/collections/2026-bluebottle-holiday-collection">홀리데이</a></li>
        <li><a href="https://kr.bluebottlecoffee.com/collections/bestsellers">베스트셀러</a></li>
        <li><a href="https://kr.bluebottlecoffee.com/pages/cafe-list">카페</a></li>
        <li><a href="https://kr.bluebottlecoffee.com/pages/coffee-lab">블로그</a></li>
      </ul>
    </nav>
    <a class="site-nav-logo" href="https://kr.bluebottlecoffee.com/" aria-label="블루보틀 홈"><img src="logo.svg" alt="블루보틀"></a>
    <div class="site-nav-actions">
      <button class="site-nav-button" aria-label="검색"><img src="search.svg" alt=""></button>
      <button class="site-nav-button" aria-label="계정"><img src="account.svg" alt=""></button>
      <button class="site-nav-button site-nav-cart" aria-label="장바구니"><img src="cart.svg" alt=""></button>
    </div>
  </div>
</header>
</body>
</html>
